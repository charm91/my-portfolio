name: Report a problem
description: Report a broken link, display problem or unexpected behaviour on the site.
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Remove private information from text, links and attachments.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead. Include any error message.
      placeholder: |
        Expected: selecting a case study would open its page.
        Actual: the Better HR card opened a missing page.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Where did it happen?
      description: Link to the affected page and name the section, case study or control.
      placeholder: https://nguwahaung.com, Better HR case-study card
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Share the steps or a small example we can follow. If it happens intermittently, describe what led up to it and how often it occurs.
      placeholder: |
        1. Open the portfolio section on the homepage.
        2. Select Better HR.
        3. A missing-page message appears.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include browser and operating system versions if known. For display problems, add your device or screen size.
      placeholder: Safari on iPhone, portrait orientation
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or extra details
      description: Share a screenshot or relevant error text. For a link problem, include the link that failed.
    validations:
      required: false
